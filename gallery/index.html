<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pixelfx</title>
<meta name="description" content="Pixel art effects and animations, every one a small piece of code. Play them, recolor them, export sprite sheets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500&family=Red+Hat+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--BODY-->
<header class="head">
  <div class="title">
    <svg class="mark" viewBox="0 0 7 7" shape-rendering="crispEdges" role="img" aria-label="Patch"><rect x="1" y="1" width="6" height="6" fill="#ffffff"/><rect x="0" y="0" width="3" height="3" fill="#f53cd1"/></svg>
    <div>
      <h1>pixelfx.</h1>
      <p class="sub"><span id="count">0</span> pixel art effects, every one a small piece of code.</p>
    </div>
  </div>
  <nav class="links">
    <a href="https://github.com/patch-gg/pixelfx" target="_blank" rel="noopener">github</a>
    <a href="https://github.com/patch-gg/pixelfx#the-skill" target="_blank" rel="noopener">claude code skill</a>
    <a href="https://patch.gg" target="_blank" rel="noopener">patch.gg</a>
  </nav>
</header>
<div class="bar">
  <div class="bar-in">
    <div class="chips" id="chips" role="toolbar" aria-label="Categories"></div>
    <input id="q" type="search" placeholder="tìm mã FX-001, tên, id..." aria-label="Search effects" autocomplete="off">
  </div>
</div>
<main id="grid"></main>
<p class="empty" id="none" hidden>Nothing matches that. Try FX-001, fire, slash or loop.</p>
<div class="tray" id="tray" hidden>
  <span id="tray-info">Đã chọn 0 hiệu ứng</span>
  <div class="tray-actions">
    <button class="btn primary" id="tray-copy" type="button">⚡ Copy tất cả cho Agent</button>
    <button class="btn" id="tray-clear" type="button">Bỏ chọn</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<dialog class="detail" id="detail" aria-labelledby="d-name">
  <div class="sheet">
    <div>
      <div class="big"><canvas id="big"></canvas><button class="close" id="d-close" type="button">close</button></div>
    </div>
    <div class="info">
      <h2 id="d-name"></h2>
      <div class="id-bar">
        <span class="id" id="d-id"></span>
        <button class="btn btn-xs" id="d-copy-id" type="button">Copy ID</button>
        <button class="btn btn-xs primary" id="d-copy-agent" type="button">⚡ Copy cho Agent</button>
      </div>
      <p id="d-desc"></p>
      <dl class="facts" id="d-facts"></dl>
      <div class="controls">
        <div class="row"><label>play</label><button class="btn" id="d-play" type="button">pause</button><button class="btn" id="d-again" type="button">again</button><span id="d-speed" class="row"></span></div>
        <div class="row"><label>backdrop</label><span id="d-bg" class="row"></span></div>
        <div class="row"><label>palette</label><select class="btn" id="d-pal" aria-label="Palette"></select><button class="btn" id="d-seed" type="button">new seed</button></div>
        <div class="row"><label>show</label><button class="btn" id="d-flip" type="button">mirror</button><button class="btn" id="d-actor" type="button">character</button><button class="btn" id="d-make" type="button">sprite sheet</button></div>
      </div>
      <div class="code-head"><span>use it</span><span><a id="d-src" target="_blank" rel="noopener">source</a> · <button class="btn" id="d-copy" type="button">copy</button></span></div>
      <pre id="d-code"></pre>
    </div>
    <div class="sheetout" id="d-sheet"></div>
  </div>
</dialog>
<!--/BODY-->
<script type="module" src="app.js"></script>
</body>
</html>
